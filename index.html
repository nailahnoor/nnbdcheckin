<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STUDENT CHECK-IN FORM</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

* { box-sizing: border-box; text-transform: lowercase; }

html{
  background:#ffffff;
  height:100%;
}

body{
  margin:0;
  font-family:'Montserrat',sans-serif;
  overflow:hidden; /* disables vertical scrolling */
}

/* orange viewport container */
.page{
  height:100dvh; /* ignores mobile browser UI */
  background:#fce2b3;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:16px;
}

/* card */
.card{
  width:100%;
  max-width:520px;
  background:#fff;
  border-radius:8px;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
  overflow:hidden;
}

.header{ border-top:10px solid #f39c12; padding:24px; }

h2{
  margin:0 0 8px 0;
  font-weight:700;
  text-transform:uppercase;
}

.subtext{
  margin:0;
  font-size:16px;
}

.section{ padding:24px; }

.input-wrap{
  width:100%;
  position:relative;
}

input[type="text"]{
  width:100%;
  padding:12px;
  font-size:16px;
  border:1px solid #ccc;
  border-radius:4px;
  font-family:'Montserrat',sans-serif;
}

input::placeholder{
  font-family:'Montserrat',sans-serif;
  font-size:16px;
  color:#555;
}

.suggestions{
  width:100%;
  background:#fff;
  border:1px solid #ccc;
  border-top:none;
  max-height:220px;
  overflow-y:auto;
  display:none;
  margin-top:-1px;
}

.suggestions div{
  padding:10px 12px;
  cursor:pointer;
}

.suggestions div:hover{
  background:#f2f2f2;
}

.error{
  color:#c62828;
  font-size:14px;
  margin-top:6px;
  display:none;
  text-align:center;
}

.footer{
  padding:16px 24px 24px;
  text-align:center;
}

button{
  background:#d84315;
  color:#fff;
  border:none;
  padding:12px 28px;
  font-weight:600;
  border-radius:4px;
  cursor:pointer;
  font-family:'Montserrat',sans-serif;
  font-size:16px;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.success{
  padding:16px 24px;
  color:#2e7d32;
  font-weight:600;
  display:none;
  text-align:center;
}

</style>
</head>

<body>

<div class="page">

<div class="card">
  <div class="header">
    <h2>STUDENT CHECK-IN FORM</h2>
    <p class="subtext">please select your name from the dropdown list.</p>
  </div>

  <div class="section">
    <div class="input-wrap">
      <input type="text" id="nameInput" placeholder="start typing here..." autocomplete="off">
      <div id="suggestions" class="suggestions"></div>
    </div>
    <div id="nameError" class="error"></div>
  </div>

  <div class="footer">
    <button id="submitBtn" onclick="submitForm()">i am here</button>
  </div>

  <div id="successMsg" class="success">
    check-in complete. thank you.
  </div>
</div>

</div>

<script>

const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwhqFn3PhuKcSL17BCZnNf_Xf1tiSavQ24nSAxhN3C2n_O0thppF9u00EvoXy8HioI/exec";

let names=[];
const input=document.getElementById('nameInput');
const box=document.getElementById('suggestions');
const btn=document.getElementById('submitBtn');
const error=document.getElementById('nameError');

fetch(`${SCRIPT_URL}?action=getNames`)
.then(r=>r.json())
.then(data=>names=data)
.catch(console.error);

input.addEventListener('focus',()=>renderList(names));

input.addEventListener('input',()=>{
const value=input.value.toLowerCase();
renderList(names.filter(n=>n.toLowerCase().includes(value)));
});

function renderList(list){

box.innerHTML='';

if(!list.length){
box.style.display='none';
return;
}

list.forEach(name=>{
const div=document.createElement('div');
div.textContent=name;

div.onclick=()=>{
input.value=name;
box.style.display='none';
};

box.appendChild(div);
});

box.style.display='block';
}

document.addEventListener('click',e=>{
if(!e.target.closest('.input-wrap')) box.style.display='none';
});

function submitForm(){

const name=input.value.trim();

error.style.display='none';

btn.disabled=true;
btn.textContent='your check-in is submitting…⏳';

fetch(`${SCRIPT_URL}?action=submitCheckIn&name=${encodeURIComponent(name)}`)
.then(r=>r.json())
.then(res=>{

btn.disabled=false;
btn.textContent='i am here';

if(res.status==='error'){
error.textContent=res.message;
error.style.display='block';
return;
}

input.value='';

document.getElementById('successMsg').style.display='block';

setTimeout(()=>{
document.getElementById('successMsg').style.display='none';
},3000);

})

.catch(()=>{

btn.disabled=false;
btn.textContent='i am here';

error.textContent="oops! that name does not exist.";
error.style.display='block';

});

}

</script>

</body>
</html>
